name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a version tag like v1.0.0
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest
        run_install: false

    - name: Install Dependencies & Build Frontend
      run: |
        pnpm install
        pnpm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Initialize Android & Sync Capacitor
      run: |
        npx cap add android
        npx cap sync android

    - name: Build Release APK with Gradle
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Determine Tag Name
      id: tag
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
        else
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        fi

    - name: Create GitHub Release & Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
        name: App Release ${{ env.TAG }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Terminal QR Code
      shell: python
      run: |
        import os
        try:
            import qrcode
        except ImportError:
            import subprocess
            subprocess.check_call(["pip", "install", "qrcode[pil]"])
            import qrcode

        repo = os.environ["GITHUB_REPOSITORY"]
        tag = os.environ["TAG"]
        download_url = f"https://github.com/{repo}/releases/download/{tag}/app-debug.apk"
        
        print(f"\n--- SCAN THIS QR CODE TO DOWNLOAD YOUR APK ---\n")
        qr = qrcode.QRCode(box_size=1, border=1)
        qr.add_data(download_url)
        qr.print_ascii(invert=True)
        print(f"\nDirect URL: {download_url}\n")